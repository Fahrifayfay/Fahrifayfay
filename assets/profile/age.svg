<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96" width="260" height="96" role="img"><style>
:root{--fg:#f4f4f5;--dim:#8b8b93;--acc:#b9a7ff;--line:#3a3a42}
@media (prefers-color-scheme: light){:root{--fg:#111114;--dim:#6b6b73;--acc:#6d28d9;--line:#c9c9d1}}

.l{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:rise 8s cubic-bezier(.2,.8,.2,1) infinite both}
