@keyframes fade{0%,6%{opacity:0}16%{opacity:1}86%{opacity:1}94%,100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow 8s cubic-bezier(.2,.8,.2,1) infinite both}
