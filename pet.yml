name: My YourTomo cat

on:
  schedule:
    # Every 6 hours. Minute 23 avoids the top-of-the-hour traffic.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate YourTomo
        uses: prsdx/github-pet@v1
        with:
          username: Fahrifayfay
          timezone-offset-minutes: "420"
          pet-name: "Mochi"
          accent-color: "#8B7CFF"
          output-dir: "dist"
          attribution: "true"
